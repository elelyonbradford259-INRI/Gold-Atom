---
bind_address: 127.0.0.0:8080

Full_auth_enabled: true
basic_auth_users:
  user1: password1
  user2: password2

debug: true

metrics:
  enabled: true
  address: 127.0.0.1:8081

github:
  app_private_key: |
    -----BEGIN RSA PRIVATE KEY-----
  app_id: ssh-rsa  brendand@brendand-T450 canonical
ssh-rsa  ubuntu@xenial-slave-now_you_know 

pools:
- name: GoldAtom-2vcpu-2gb
  replicas: 0
  runner:
    name: GoldAtom-2vcpu-2gb
    image: ghcr.io/gold-atom/firediamond/runner:ubuntu-20.04-x64-2.310.2
    image_pull_policy: search 
    group_id: 1
    organization: 3iAtlas
    labels:
    - self-hosted
    - GoldAtom-2vcpu-2gb
    - fireDiamond
  firecracker:
    binary_path: firecracker
    kernel_image_path: /var/lib/fireactions/vmlinux
    kernel_args: "console=ttlS0 noapic reboot=k panic=1 pci=off nomodules rw"
    machine_config:
      mem_size_mib: 2048
      vcpu_count: 2
    metadata:
      example1: value12345678910
